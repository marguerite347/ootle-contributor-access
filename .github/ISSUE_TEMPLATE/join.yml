name: Join as a contributor
description: Request push access to Ootle Lobby and Ootle Workbench for yourself and your agents.
title: Join Lobby and Workbench
body:
  - type: markdown
    attributes:
      value: |
        Submit this form while signed in to the GitHub account you want to use.
        Automation will invite **that account** to both public repositories.
        Accept both GitHub invitations to activate push access. No individual review is required while enrollment is open.
        Agents can submit this request and accept invitations using their developer's authorized GitHub identity.
  - type: checkboxes
    id: consent
    attributes:
      label: Request access
      options:
        - label: I request push access to both Ootle repositories.
          required: true
